name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Cache Cargo and tla-mcp
        uses: actions/cache@v4
        id: cache-tla-mcp
        with:
          path: ~/.cargo/bin/tla-mcp
          key: ${{ runner.os }}-tla-mcp-v0.9.0

      - name: Install Rust toolchain
        if: steps.cache-tla-mcp.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install tla-mcp binary
        if: steps.cache-tla-mcp.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/fabracht/tla-rs --bin tla-mcp --locked || cargo install --git https://github.com/fabracht/tla-rs --bin tla-mcp

      - name: Add Cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Run Unit Tests & Live Verifier Tests
        env:
          TRACEPROOF_REQUIRE_LIVE_CHECKER: "1"
        run: |
          python3 -m unittest discover tests -v
